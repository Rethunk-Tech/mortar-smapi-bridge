name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A tag push publishes, so it is never cancelled by a later push to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: shellcheck
        run: shellcheck -x scripts/*.sh
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build
      - name: Keep the build for the release job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bridge
          path: src/MortarSmapiBridge/bin/Release/net6.0
          if-no-files-found: error

  # Only a v* tag publishes, so only this job can write to the repository.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: bridge
          path: out
      - name: Package
        run: |
          version="$(jq -r .Version out/manifest.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match csproj Version $version" >&2
            exit 1
          fi
          mkdir -p dist/MortarSmapiBridge
          cp out/MortarSmapiBridge.dll out/manifest.json dist/MortarSmapiBridge/
          (cd dist && zip -r "MortarSmapiBridge-$version.zip" MortarSmapiBridge && sha256sum "MortarSmapiBridge-$version.zip" > "MortarSmapiBridge-$version.zip.sha256")
          echo "version=$version" >>"$GITHUB_ENV"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            "dist/MortarSmapiBridge-$version.zip" "dist/MortarSmapiBridge-$version.zip.sha256"
