name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: scripts/fetch-smapi.sh
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          out=src/MortarSmapiBridge/bin/Release/net6.0
          mkdir -p dist/MortarSmapiBridge
          cp "$out/MortarSmapiBridge.dll" "$out/manifest.json" dist/MortarSmapiBridge/
          (cd dist && zip -r "MortarSmapiBridge-$version.zip" MortarSmapiBridge && sha256sum "MortarSmapiBridge-$version.zip" > "MortarSmapiBridge-$version.zip.sha256")
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            "dist/MortarSmapiBridge-$version.zip" "dist/MortarSmapiBridge-$version.zip.sha256"
