name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A tag push publishes, so it is never cancelled by a later push to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    # Dependabot PRs are never merged (the bump is applied by hand on main, where this runs), so CI on them is spent minutes.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x
      # The runner's apt shellcheck lags (0.9.0 on Ubuntu 24.04), so CI pins the release developers run.
      # actionlint is not on the image; gate's workflows check uses it from PATH.
      - name: Install gate tools
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          mv "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" "$RUNNER_TEMP/bin/shellcheck"
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          # Lefthook's pre-commit gitleaks is skippable (--no-verify, hookless clone); CI is the scan that still runs.
          curl -fsSL --max-time 60 --retry 5 --retry-all-errors -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          # @latest would let the gate binary change under the same workflow SHA.
          go install github.com/Rethunk-Tech/rethunk-gate-cli/cmd/gate@v0.6.7-0.20261015051856-7f6f84d9bbe5
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: gitleaks
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --log-level warn
      - run: gate
      - name: Keep the build for the release job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bridge
          path: src/MortarSmapiBridge/bin/Release/net6.0
          if-no-files-found: error

  # Only a v* tag publishes, so only this job can write to the repository.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: bridge
          path: out
      - name: Package
        run: |
          version="$(jq -r .Version out/manifest.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match csproj Version $version" >&2
            exit 1
          fi
          mkdir -p dist/MortarSmapiBridge
          cp out/MortarSmapiBridge.dll out/manifest.json dist/MortarSmapiBridge/
          (cd dist && zip -r "MortarSmapiBridge-$version.zip" MortarSmapiBridge && sha256sum "MortarSmapiBridge-$version.zip" > "MortarSmapiBridge-$version.zip.sha256")
          echo "version=$version" >>"$GITHUB_ENV"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            "dist/MortarSmapiBridge-$version.zip" "dist/MortarSmapiBridge-$version.zip.sha256"

  # The mod sites take the zip the release job attached, so every site carries the same file.
  nexus:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the release zip
        id: zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "MortarSmapiBridge-$version.zip"
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Upload to Nexus Mods (Stardew Valley mod 53964)
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2  # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: 53964
          file_id: 186981
          filename: MortarSmapiBridge-${{ steps.zip.outputs.version }}.zip
          version: ${{ steps.zip.outputs.version }}
          display_name: Mortar SMAPI Bridge
          archive_existing_version: true
          update_mod_version: true
          changelog: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}

  curseforge:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload to CurseForge (project 1747618)
        env:
          GH_TOKEN: ${{ github.token }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "MortarSmapiBridge-$version.zip"
          api=https://stardewvalley.curseforge.com/api
          # Every Stardew 1.6 release from the manifest's MinimumGameVersion (1.6.14) on, so new game versions are picked up.
          curl -fsS --config <(printf 'header = "X-Api-Token: %s"\n' "$CURSEFORGE_TOKEN") "$api/game/versions" >versions.json
          metadata="$(python3 - "$version" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" <<'PY'
          import json, sys
          def key(name):
              try:
                  return tuple(int(p) for p in name.strip().split("."))
              except ValueError:
                  return None
          ids = [v["id"] for v in json.load(open("versions.json")) if (k := key(v["name"])) and len(k) == 3 and k[:2] == (1, 6) and k >= (1, 6, 14)]
          if not ids:
              sys.exit("no Stardew 1.6.14+ game versions on CurseForge")
          print(json.dumps({"changelog": sys.argv[2], "changelogType": "text", "displayName": f"Mortar SMAPI Bridge {sys.argv[1]}", "gameVersions": ids, "releaseType": "release"}))
          PY
          )"
          curl -fsS --config <(printf 'header = "X-Api-Token: %s"\n' "$CURSEFORGE_TOKEN") \
            -F "metadata=$metadata" -F "file=@MortarSmapiBridge-$version.zip" "$api/projects/1747618/upload-file"
